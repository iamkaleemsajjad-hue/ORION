name: Feature request
description: Propose a scoped software feature.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem and proposed behavior
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: Architecture, data, or model boundaries affected
      description: Note implications for weights, tokenizer IDs, dataset rights, offline behavior, and MADAD independence.
    validations:
      required: true
