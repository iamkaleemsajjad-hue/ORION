name: Security checks

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --all-packages --group dev
      - name: Audit installed Python dependencies
        run: uv run --with pip-audit pip-audit --skip-editable
      - name: Check for pickle-based model loading
        shell: bash
        run: |
          if rg -n 'torch\.load|pickle\.load|pytorch_model\.bin' packages; then
            echo "Unsafe model deserialization pattern found"
            exit 1
          fi
