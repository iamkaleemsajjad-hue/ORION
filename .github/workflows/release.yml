name: Build package release artifacts

on:
  workflow_dispatch:
    inputs:
      python-version:
        description: Python used to build the wheels
        required: true
        default: "3.12"

permissions:
  contents: read

jobs:
  build-wheels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --all-packages --group dev
      - run: uv run python -m pip install build
      - name: Build all independently installable packages
        shell: bash
        run: |
          mkdir -p dist
          for package in packages/*; do
            uv run python -m build --wheel --outdir dist "$package"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: orion-python-wheels
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 14
