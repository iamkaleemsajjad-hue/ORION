[pytest]
testpaths = tests
pythonpath =
    packages/orion-core/src
    packages/orion-tokenizer/src
    packages/orion-data/src
    packages/orion-train/src
    packages/orion-eval/src
    packages/orion-100m/src
    packages/orion-300m/src
    packages/orion-madad-adapter/src
addopts = -ra --strict-markers
markers =
    slow: tests that perform longer CPU computations
    network: tests that require network access
