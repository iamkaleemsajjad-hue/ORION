[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orion-100m"
version = "0.1.0"
description = "Independent ORION-100M educational document encoder software"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
  "orion-core==0.1.0",
  "orion-tokenizer==0.1.0",
  "orion-data==0.1.0",
  "orion-train==0.1.0",
  "orion-eval==0.1.0",
  "torch>=2.1,<3",
  "pydantic>=2.7,<3",
]

[project.scripts]
orion100m = "orion_100m.cli:main"

[project.optional-dependencies]
api = ["fastapi>=0.110,<1", "uvicorn>=0.30,<1"]
export = ["onnx>=1.16,<2", "onnxruntime>=1.18,<2"]

[tool.setuptools.packages.find]
where = ["src"]
