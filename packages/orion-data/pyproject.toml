[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orion-data"
version = "0.1.0"
description = "Offline-first data provenance and preparation pipelines for ORION AI"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["orion-core==0.1.0", "numpy>=1.24,<3", "pydantic>=2.7,<3", "PyYAML>=6,<7"]

[project.optional-dependencies]
parquet = ["pyarrow>=15,<25"]
hub = ["huggingface-hub>=0.25,<2"]
dedupe = ["datasketch>=1.6,<2"]
prepare = ["orion-tokenizer==0.1.0"]

[project.scripts]
orion-data = "orion_data.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
