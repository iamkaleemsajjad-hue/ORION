[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orion-train"
version = "0.1.0"
description = "Reusable, resumable software training infrastructure for ORION AI"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
  "orion-core==0.1.0",
  "torch>=2.1,<3",
  "safetensors>=0.4,<1",
  "numpy>=1.24,<3",
  "pydantic>=2.7,<3",
]

[tool.setuptools.packages.find]
where = ["src"]
