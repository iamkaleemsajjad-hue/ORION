[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orion-core"
version = "0.1.0"
description = "Shared independent infrastructure and Transformer building blocks for ORION AI"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
  "torch>=2.1,<3",
  "safetensors>=0.4,<1",
  "pydantic>=2.7,<3",
  "PyYAML>=6,<7",
]

[project.scripts]
orion = "orion_core.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
