[project]
name = "orion-ai-workspace"
version = "0.1.0"
description = "Workspace and development tooling for independent ORION AI model packages"
requires-python = ">=3.10"
license = "MIT"
readme = "README.md"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
orion-core          = { workspace = true }
orion-tokenizer     = { workspace = true }
orion-data          = { workspace = true }
orion-train         = { workspace = true }
orion-eval          = { workspace = true }
orion-100m          = { workspace = true }
orion-300m          = { workspace = true }
orion-madad-adapter = { workspace = true }

[dependency-groups]
dev = [
  "pytest>=8.0,<10",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
  "mypy>=1.11,<3",
  "types-PyYAML>=6.0,<7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
  "packages/orion-core/src",
  "packages/orion-tokenizer/src",
  "packages/orion-data/src",
  "packages/orion-train/src",
  "packages/orion-eval/src",
  "packages/orion-100m/src",
  "packages/orion-300m/src",
  "packages/orion-madad-adapter/src",
]
addopts = "-ra --strict-markers"
markers = [
  "slow: tests that perform longer CPU computations",
  "network: tests that require network access (not used in CI by default)",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["packages/*/src", "tests", "tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
namespace_packages = true
mypy_path = "packages/orion-core/src:packages/orion-tokenizer/src:packages/orion-data/src:packages/orion-train/src:packages/orion-eval/src:packages/orion-100m/src:packages/orion-300m/src:packages/orion-madad-adapter/src"
exclude = ["build", "dist"]

[tool.coverage.run]
branch = true
source = [
  "orion_core", "orion_tokenizer", "orion_data", "orion_train",
  "orion_eval", "orion_100m", "orion_300m", "orion_madad_adapter",
]
